# =============================================================================
# Kali — nginx dev configuration
# =============================================================================
# En modo dev, Vite dev server (HMR) es quien sirve el frontend. Este nginx
# es un proxy-passthrough hacia Vite (HTTP) y hacia kali-core (WS).
#
#   :8080 (este nginx)
#     ├── /    → :5173 (Vite dev, HMR)
#     └── /ws  → :8900 (kali-core, WS)   [bypassing Vite: el WS upgrade
#                                         no se proxya bien via Vite]
#
# En prod, en cambio, nginx sirve los estáticos de /app/kali-web/dist
# directamente. Ver nginx.conf.
# =============================================================================

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name _;

    # Gzip igual que prod
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+ml;
    gzip_min_length 256;
    gzip_vary on;

    # Security headers (mismos que prod)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ── Proxy total a Vite dev server (HMR + APIs via Vite) ─────────────
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ── Proxy WS directo a kali-core (bypassing Vite) ───────────────
    # Vite proxy /ws a kali-core da 502 porque Vite no maneja bien el
    # WebSocket upgrade en este contexto. nginx-dev.conf debe puentear
    # /ws directo a 8900 para que el chat funcione en LAN y vía mDNS.
    location /ws {
        proxy_pass http://127.0.0.1:8900/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
